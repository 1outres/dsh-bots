# Installs this plugin on its own (dsh plugin add @1outres/dsh-bot-connector-google).
# The @1outres/dsh-bots bundle inserts the same "bot-connector-google" row, so select
# one bundle or the other, never both.
- insert:
    - id: bot-connector-google
      name: "@1outres/dsh-bot-connector-google"
