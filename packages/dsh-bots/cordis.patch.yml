# Row ids (bot-<name>) are the settings namespaces the plugins read. Disable a
# row here (or in your profile patch) to turn that plugin off without
# uninstalling it.
#
# Each plugin package also ships this row as its own one-row bundle. Select
# either this bundle or a plugin's own bundle for a given plugin, never both.
- insert:
    - id: bot-core
      name: "@1outres/dsh-bot-core"
    - id: bot-vm
      name: "@1outres/dsh-bot-vm"
    - id: bot-discord
      name: "@1outres/dsh-bot-discord"
    - id: bot-connector-google
      name: "@1outres/dsh-bot-connector-google"
    - id: bot-connector-desktop
      name: "@1outres/dsh-bot-connector-desktop"
    - id: bot-web
      name: "@1outres/dsh-bot-web"
    - id: bot-connector-browser
      name: "@1outres/dsh-bot-connector-browser"
