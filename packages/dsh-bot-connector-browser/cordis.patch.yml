# Installs this plugin on its own (dsh plugin add @1outres/dsh-bot-connector-browser).
# The @1outres/dsh-bots bundle inserts the same "bot-connector-browser" row, so select
# one bundle or the other, never both.
- insert:
    - id: bot-connector-browser
      name: "@1outres/dsh-bot-connector-browser"
